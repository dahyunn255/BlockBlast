<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Block Blast 10x10</title>
<meta name="theme-color" content="#1b1f2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Block Blast">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app" class="theme-classic">

  <header class="topbar">
    <div class="score-box">
      <span class="label">SCORE</span>
      <span id="score" class="value">0</span>
    </div>
    <div class="score-box">
      <span class="label">BEST</span>
      <span id="best" class="value">0</span>
    </div>
    <div class="topbar-buttons">
      <button id="themeBtn" class="icon-btn" aria-label="Change theme">🎨</button>
      <button id="muteBtn" class="icon-btn" aria-label="Mute sound">🔊</button>
    </div>
  </header>

  <div id="comboPopup" class="combo-popup"></div>

  <main class="board-wrap">
    <div id="board" class="board"></div>
  </main>

  <footer class="tray-wrap">
    <div id="tray" class="tray"></div>
  </footer>

  <div id="gameOverOverlay" class="overlay hidden">
    <div class="overlay-card">
      <h1>Game Over</h1>
      <p>คะแนนของคุณ</p>
      <p id="finalScore" class="final-score">0</p>
      <p id="newBestBadge" class="new-best hidden">🏆 สถิติใหม่!</p>
      <button id="restartBtn" class="primary-btn">เล่นอีกครั้ง</button>
    </div>
  </div>

</div>

<script src="js/storage.js"></script>
<script src="js/audio.js"></script>
<script src="js/pieces.js"></script>
<script src="js/board.js"></script>
<script src="js/drag.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
