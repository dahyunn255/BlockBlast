<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Block Blast 10x10</title>
<meta name="theme-color" content="#1b1f2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Block Blast">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css?v=9">
</head>
<body>
<div id="app" class="theme-classic">

  <!-- Home screen -->
  <section id="homeScreen" class="screen">
    <div class="home-content">
      <div class="coin-pill">🪙 <span id="homeCoins">0</span></div>
      <h1 class="game-title">Block Blast</h1>
      <p class="game-subtitle">10 × 10</p>
      <div class="home-buttons">
        <button id="playEndlessBtn" class="mode-btn mode-btn-endless">
          <span class="mode-btn-title">Endless</span>
          <span class="mode-btn-desc">เล่นไม่จำกัด ทำคะแนนสูงสุด</span>
        </button>
        <button id="playLevelBtn" class="mode-btn mode-btn-level">
          <span class="mode-btn-title">ด่าน (Level)</span>
          <span class="mode-btn-desc">พิชิตเป้าหมายทีละด่าน</span>
        </button>
        <button id="playDailyBtn" class="mode-btn mode-btn-daily">
          <span class="mode-btn-title">📅 ภารกิจประจำวัน</span>
          <span id="dailyStatus" class="mode-btn-desc">ยังไม่ได้เล่นวันนี้</span>
        </button>
      </div>
      <div class="home-link-row">
        <button id="achievementsBtn" class="text-link-btn">🏆 ความสำเร็จ</button>
        <button id="shopBtn" class="text-link-btn">🛒 ร้านค้า</button>
      </div>
      <div class="home-footer">
        <span class="label">BEST (Endless)</span>
        <span id="homeBest" class="value">0</span>
      </div>
    </div>
  </section>

  <!-- Level select screen -->
  <section id="levelSelectScreen" class="screen hidden">
    <header class="sub-topbar">
      <button id="levelSelectBackBtn" class="icon-btn" aria-label="Back">←</button>
      <h2>เลือกด่าน</h2>
    </header>
    <div id="levelGrid" class="level-grid"></div>
  </section>

  <!-- Achievements screen -->
  <section id="achievementsScreen" class="screen hidden">
    <header class="sub-topbar">
      <button id="achievementsBackBtn" class="icon-btn" aria-label="Back">←</button>
      <h2>ความสำเร็จ</h2>
    </header>
    <div id="achievementList" class="achievement-list"></div>
  </section>

  <!-- Shop screen -->
  <section id="shopScreen" class="screen hidden">
    <header class="sub-topbar">
      <button id="shopBackBtn" class="icon-btn" aria-label="Back">←</button>
      <h2>ร้านค้า</h2>
      <div class="coin-pill shop-coin-pill">🪙 <span id="shopCoins">0</span></div>
    </header>
    <div class="shop-body">
      <h3 class="shop-section-title">ธีม</h3>
      <div id="shopThemes" class="shop-list"></div>
      <h3 class="shop-section-title">สีบล็อก</h3>
      <div id="shopSkins" class="shop-list"></div>
      <h3 class="shop-section-title">เอฟเฟกต์ตอนบล็อกหาย</h3>
      <div id="shopEffects" class="shop-list"></div>
    </div>
  </section>

  <!-- Game screen -->
  <section id="gameScreen" class="screen hidden">
    <header class="topbar">
      <button id="menuBtn" class="icon-btn" aria-label="Back to menu">☰</button>
      <div class="score-box">
        <span class="label">SCORE</span>
        <span id="score" class="value">0</span>
      </div>
      <div class="score-box" id="secondaryBox">
        <span class="label" id="secondaryLabel">BEST</span>
        <span id="secondaryValue" class="value">0</span>
      </div>
      <div class="score-box hidden" id="movesBox">
        <span class="label">MOVES</span>
        <span id="movesValue" class="value">0</span>
      </div>
      <div class="topbar-buttons">
        <button id="themeBtn" class="icon-btn" aria-label="Change theme">🎨</button>
        <button id="muteBtn" class="icon-btn" aria-label="Mute sound">🔊</button>
      </div>
    </header>

    <div id="comboPopup" class="combo-popup"></div>
    <div id="achievementToast" class="achievement-toast">
      <span class="achievement-toast-icon">🏆</span>
      <div>
        <div class="achievement-toast-label">ปลดล็อกความสำเร็จ!</div>
        <div id="achievementToastTitle" class="achievement-toast-title"></div>
      </div>
    </div>

    <main class="board-wrap">
      <div id="board" class="board"></div>
    </main>

    <footer class="tray-wrap">
      <div class="tray-toolbar">
        <div class="coin-pill game-coin-pill">🪙 <span id="gameCoins">0</span></div>
        <button id="rerollBtn" class="reroll-btn">
          <span class="reroll-icon">🔀</span>
          <span>รีโรล</span>
          <span id="rerollCount">3</span>
        </button>
      </div>
      <div id="tray" class="tray"></div>
    </footer>
  </section>

  <!-- Reusable result overlay: endless game-over / level complete / level failed -->
  <div id="resultOverlay" class="overlay hidden">
    <div class="overlay-card">
      <h1 id="resultTitle">Game Over</h1>
      <p id="resultMessage">คะแนนของคุณ</p>
      <p id="resultStat" class="final-score">0</p>
      <p id="resultBadge" class="new-best hidden">🏆 สถิติใหม่!</p>
      <div class="overlay-buttons">
        <button id="resultPrimaryBtn" class="primary-btn">เล่นอีกครั้ง</button>
        <button id="resultMenuBtn" class="secondary-btn">กลับเมนู</button>
      </div>
    </div>
  </div>

</div>

<script src="js/storage.js?v=9"></script>
<script src="js/achievements.js?v=9"></script>
<script src="js/shop.js?v=9"></script>
<script src="js/audio.js?v=9"></script>
<script src="js/pieces.js?v=9"></script>
<script src="js/board.js?v=9"></script>
<script src="js/levels.js?v=9"></script>
<script src="js/daily.js?v=9"></script>
<script src="js/drag.js?v=9"></script>
<script src="js/game.js?v=9"></script>
<script src="js/main.js?v=9"></script>
</body>
</html>
